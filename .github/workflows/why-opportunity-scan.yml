name: WHY Opportunity Scan
run-name: WHY scan ${{ inputs.scan_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      retry_run_id:
        description: 'Optional: previous Actions run ID; retry unfinished research only'
        required: false
        type: string
      scan_id:
        description: 'Leave blank for a manual GitHub run'
        required: false
        type: string
      context_json:
        description: 'Optional history context supplied by the dashboard'
        required: false
        default: '{}'
        type: string
      research:
        description: 'Research and cluster with OpenAI (uses API credits)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: why-opportunity-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      WHY_RETRY: ${{ inputs.retry_run_id != '' }}
      RETRY_RUN_ID: ${{ inputs.retry_run_id }}
      WHY_SCAN_ID: ${{ inputs.scan_id }}
      WHY_CONTEXT_JSON: ${{ inputs.context_json }}
      WHY_RESEARCH: ${{ inputs.research }}
      OPENAI_MODEL: gpt-5
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install collector packages
        shell: Rscript {0}
        run: |
          packages <- c('httr2', 'jsonlite')
          missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly=TRUE)]
          if (length(missing)) install.packages(missing, repos='https://cloud.r-project.org')
      - name: Find previous scanner history
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            if (process.env.RETRY_RUN_ID) {
              if (!/^\d+$/.test(process.env.RETRY_RUN_ID)) throw new Error('Invalid retry run ID');
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id:process.env.RETRY_RUN_ID});
              if (run.path!=='.github/workflows/why-opportunity-scan.yml' || run.head_branch!=='main') throw new Error('Retry must use this scanner workflow on main');
              core.setOutput('run_id',run.id);
              return;
            }
            const {data} = await github.rest.actions.listArtifactsForRepo({
              ...context.repo, name:'why-opportunity-result', per_page:100
            });
            const artifacts=data.artifacts.filter(a=>!a.expired && a.workflow_run?.head_branch==='main' && a.workflow_run?.id!==context.runId);
            if (artifacts.length) core.setOutput('run_id', artifacts[0].workflow_run.id);
      - name: Restore previous scanner context
        if: steps.previous.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: why-opportunity-result
          path: why_scanner/previous
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Prepare saved scan for research retry
        if: inputs.retry_run_id != ''
        run: node why_scanner/prepare-retry.mjs
      - name: Collect four Google Trends windows
        if: inputs.retry_run_id == ''
        shell: Rscript {0}
        run: source('why_scanner/collect.R', echo=FALSE)
      - name: Cluster and research stories
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: pwsh
        run: node why_scanner/research.mjs
      - name: Save scan and reusable history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: why-opportunity-result
          path: |
            why_scanner/output/why-scan.json
            why_scanner/output/context.json
          if-no-files-found: error
          retention-days: 90
